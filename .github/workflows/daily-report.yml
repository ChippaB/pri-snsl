name: Daily Build Report

on:
  # cron-job.org is now the primary scheduler; keep workflow_dispatch enabled.
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date (YYYY-MM-DD) or leave empty for yesterday'
        required: false
        default: ''
      test_mode:
        description: 'Test mode (no email sent)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Diagnostics
        run: |
          echo "UTC now: $(date -u)"
          echo "Runner local now: $(date)"
          echo "GitHub event: $GITHUB_EVENT_NAME"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub sha: $GITHUB_SHA"

      - name: Generate and send report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          PIECES_PER_BOX: '100'
          GSHEET_CREDENTIALS_JSON: ${{ secrets.GSHEET_CREDENTIALS_JSON }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scripts/daily_report.py --test
          elif [ -n "${{ github.event.inputs.report_date }}" ]; then
            python scripts/daily_report.py "${{ github.event.inputs.report_date }}"
          else
            python scripts/daily_report.py
          fi
      
      - name: Report complete
        run: echo "✅ Daily Build Report workflow completed"
